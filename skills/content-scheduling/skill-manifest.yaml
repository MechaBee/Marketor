# Content Scheduling Skill Manifest

skill_id: content-scheduling
version: "1.0.0"
status: active

description: |
  Manage content post scheduling and calendar maintenance across campaigns and platforms.
  IMPORTANT: This skill does NOT publish directly to external platforms (Facebook, Instagram,
  LinkedIn, Google Ads). Status changes are for record-keeping only - users publish manually
  then report back to update the calendar.

capabilities:
  initialize_calendar:
    description: Initialize a new content posting calendar for a campaign
    instruction_file: capabilities/initialize-calendar.md
    required_params:
      - campaign
    optional_params: []
    trigger_patterns:
      - "setup campaign calendar"
      - "initialize campaign calendar"

  schedule_post:
    description: Add a content post to the campaign calendar with scheduling metadata
    instruction_file: capabilities/schedule-post.md
    required_params:
      - content_file_path
      - platform
      - format
      - scheduled_date
      - scheduled_time
    optional_params:
      - timezone
      - media_files
    trigger_patterns:
      - "schedule.*post"
      - "add.*to.*calendar"
      - "plan.*post.*for"
    
  list_posts:
    description: Query and list scheduled posts with optional filtering
    instruction_file: capabilities/list-posts.md
    required_params: []
    optional_params:
      - date_range
      - platform
      - campaign_id
      - status
      - month_folder
    trigger_patterns:
      - "show.*scheduled"
      - "list.*calendar"
      - "what.*scheduled"
      - "upcoming.*posts"
    
  review_drafts:
    description: Discover unscheduled content and guide interactive scheduling process
    instruction_file: capabilities/review-drafts.md
    required_params: []
    optional_params:
      - campaign_id
    trigger_patterns:
      - "schedule.*posts"
      - "ready.*to.*schedule"
      - "what.*unscheduled"
      - "schedule.*campaign"
      - "review.*unscheduled"
    
  mark_published:
    description: Record that user manually published a post - updates status and adds publishing metadata
    instruction_file: capabilities/mark-published.md
    required_params:
      - content_file_path
      - published_date
    optional_params:
      - platform_post_id
      - platform_url
    trigger_patterns:
      - "publish.*post"
      - "mark.*published"
      - "post.*went.*live"
    note: "Record-keeping only - user publishes manually then reports back. Auto-detects campaign vs regular-social from content_file_path"

  mark_failed:
    description: Record that a post failed to publish manually - updates status and adds failure reason
    instruction_file: capabilities/mark-published.md
    required_params:
      - content_file_path
    optional_params:
      - failure_reason
    trigger_patterns:
      - "post.*failed"
      - "mark.*failed"
      - "couldn't.*publish"
    note: "Record-keeping only - user reports publishing failure"
    
  validate_schedule:
    description: Validate calendar integrity and check for errors or conflicts
    instruction_file: capabilities/validate-schedule.md
    required_params: []
    optional_params:
      - campaign_id
    trigger_patterns:
      - "validate.*calendar"
      - "check.*calendar"
      - "calendar.*errors"

  configure_cadence:
    description: Set up or update weekly posting cadence targets per platform and objective mix
    instruction_file: capabilities/configure-cadence.md
    required_params: []
    optional_params:
      - platform
      - weekly_min
      - weekly_max
      - objective
      - target_percentage
      - notes
    trigger_patterns:
      - "set.*cadence"
      - "configure.*posting.*frequency"
      - "update.*cadence.*target"
      - "how.*many.*posts.*per.*week"
      - "weekly.*posting.*goals"
      - "content.*mix"
      - "objective.*target"

  cadence_report:
    description: Generate report comparing cadence targets vs scheduled/published posts for a week
    instruction_file: capabilities/cadence-report.md
    required_params: []
    optional_params:
      - week_start_date
      - detail_level
      - include_objectives
    trigger_patterns:
      - "cadence.*report"
      - "check.*posting.*frequency"
      - "are.*we.*on.*track"
      - "weekly.*posting.*status"
      - "posting.*progress"
      - "content.*mix.*report"

required_tools:
  - workspace_read_operations
  - workspace_write_operations

optional_tools:
  - upload_to_google_drive
  - share_google_drive_items

workspace_paths:
  master_calendar: "/calendar/master-calendar.yaml"
  campaign_calendars: "/campaigns/*/calendar.yaml"
  regular_social_calendar: "/regular-social/calendar.yaml"
  cadence_targets: "/policies/cadence-targets.yaml"
  path_patterns:
    campaign_content: "campaigns/*/content-assets/**"
    regular_social_content: "regular-social/[YYYY-M##]/**"
    regular_social_evergreen: "regular-social/evergreen/**"

validation_rules:
  date_format: "YYYY-MM-DD"
  time_format: "HH:MM (24-hour)"
  default_timezone: "Europe/Budapest"
  supported_calendar_types:
    - campaign
    - regular
  month_folder_format: "YYYY-M## or 'evergreen'"
  supported_platforms:
    - facebook
    - instagram
    - google
    - linkedin
    - twitter
  supported_formats:
    facebook:
      - fb-link-post
      - fb-text-post
      - fb-short-video
    instagram:
      - ig-reel
      - ig-carousel
      - ig-story
      - ig-image-post
    google:
      - g-search
      - g-display
      - g-pmax
      - g-discovery
    linkedin:
      - li-post
      - li-article
    twitter:
      - tw-post
      - tw-thread
      - tw-reply
  post_statuses:
    - draft        # Content ready, not yet scheduled
    - scheduled    # Ready for manual publishing
    - published    # User reported successful publish
    - failed       # User reported publishing failed
  post_status_transitions:
    draft: [scheduled]
    scheduled: [published, failed]
    published: []  # Terminal state
    failed: [scheduled]  # Can retry
  cadence_rules:
    week_definition: "ISO week (Monday-Sunday)"
    detail_levels:
      - basic
      - detailed
    supported_objectives:
      - awareness
      - engagement
      - conversion
      - traffic
      - thought-leadership

# Calendar format and integration notes: see instructions.md
